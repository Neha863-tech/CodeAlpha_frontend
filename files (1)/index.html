<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculator</title>
  <meta name="description" content="A precise, keyboard-accessible calculator built with vanilla HTML, CSS, and JavaScript." />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <main class="page">
    <section class="calculator" aria-label="Calculator">
      <div class="display">
        <div class="display__expression" id="expression" aria-hidden="true"></div>
        <output class="display__value" id="output" role="status" aria-live="polite" aria-atomic="true">0</output>
      </div>
      <div class="keypad" id="keypad" role="group" aria-label="Calculator keypad">
        <button type="button" class="key key--function" data-action="clear">C</button>
        <button type="button" class="key key--function" data-action="sign">+/&minus;</button>
        <button type="button" class="key key--function" data-action="delete" aria-label="Backspace">⌫</button>
        <button type="button" class="key key--operator" data-action="operator" data-value="÷">÷</button>

        <button type="button" class="key key--number" data-action="number" data-value="7">7</button>
        <button type="button" class="key key--number" data-action="number" data-value="8">8</button>
        <button type="button" class="key key--number" data-action="number" data-value="9">9</button>
        <button type="button" class="key key--operator" data-action="operator" data-value="×">×</button>

        <button type="button" class="key key--number" data-action="number" data-value="4">4</button>
        <button type="button" class="key key--number" data-action="number" data-value="5">5</button>
        <button type="button" class="key key--number" data-action="number" data-value="6">6</button>
        <button type="button" class="key key--operator" data-action="operator" data-value="−">&minus;</button>

        <button type="button" class="key key--number" data-action="number" data-value="1">1</button>
        <button type="button" class="key key--number" data-action="number" data-value="2">2</button>
        <button type="button" class="key key--number" data-action="number" data-value="3">3</button>
        <button type="button" class="key key--operator" data-action="operator" data-value="+">+</button>

        <button type="button" class="key key--number key--zero" data-action="number" data-value="0">0</button>
        <button type="button" class="key key--number" data-action="decimal">.</button>
        <button type="button" class="key key--equals" data-action="equals" aria-label="Equals">=</button>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
